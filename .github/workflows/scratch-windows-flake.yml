# SCRATCH (not for merge): reproduce the windows-only CLI-test flakes and test their causes.
name: scratch-windows-flake
on:
  push:
    branches: [claude/eager-lovelace-5fvknn]
    paths: [".github/workflows/scratch-windows-flake.yml", ".scratch/**"]
  workflow_dispatch:
env:
  MAIN_SHA: b5274f1516ec2c76f3ca83917ccabf3e672a8457
  UV_THREADPOOL_SIZE: "16"
  BUNDLE: >-
    test/federation/drop-cli.test.ts test/cli/user-roles.test.ts
    test/federation/install-by-federation-cli.test.ts test/cli/stock-depth.test.ts
    test/cli/pen-grant-window.test.ts test/gateway/boot-resilience.test.ts
    test/federation/friend-scenario.test.ts test/cli/path-resolution.test.ts
    test/server/oauth-register.test.ts test/store/corrupt-row-recovery.test.ts
    test/cli/federate-list-orphan.test.ts test/cli/grant-serving-warning.test.ts
    test/cli/stock.test.ts test/cli/stock-refs.test.ts test/store/erasure-at-rest.test.ts
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: exempt the workspace and RUNNER_TEMP from Defender (as ci.yml does)
        shell: powershell
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) { Add-MpPreference -ExclusionPath $p }
          "TEMP=$env:TEMP TMP=$env:TMP RUNNER_TEMP=$env:RUNNER_TEMP"
          (Get-MpPreference).ExclusionPath
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AMRunningMode, OnAccessProtectionEnabled | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free, Root
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: durable-write cost per directory, alone
        shell: bash
        run: node -p "require('os').tmpdir()" && node .scratch/probe.mjs "$PWD" 60
      - name: durable-write cost per directory, four writers at once (a loaded suite)
        shell: bash
        run: |
          for k in 1 2 3 4; do node .scratch/probe.mjs "$PWD" 60 > probe-$k.txt & done; wait
          cat probe-*.txt

  stall:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: { code: [main, fix], fixture_close: ["0", "1"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.code == 'main'
        with: { ref: "${{ env.MAIN_SHA }}", path: code-main }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: run the stalled pull (code=${{ matrix.code }}, fixture close=${{ matrix.fixture_close }})
        shell: bash
        env: { FIXTURE_CLOSE: "${{ matrix.fixture_close }}" }
        run: |
          CODE=.; [ "${{ matrix.code }}" = main ] && CODE=code-main
          cd "$CODE" && npm ci --no-audit --no-fund >/dev/null
          mkdir -p test/zz && cp "$GITHUB_WORKSPACE/.scratch/drop-cli-stalled.test.ts" test/zz/
          for i in 1 2 3; do npx vitest run test/zz/drop-cli-stalled.test.ts 2>&1 | grep -E "Tests |federate:|✓|×" || true; done

  load:
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: { code: [main, fix], temp: [default, runner] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.code == 'main'
        with: { ref: "${{ env.MAIN_SHA }}", path: code-main }
      - name: exempt the workspace and RUNNER_TEMP from Defender (as ci.yml does)
        shell: powershell
        run: foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) { Add-MpPreference -ExclusionPath $p }
      - name: put the tests' temp dir under RUNNER_TEMP
        if: matrix.temp == 'runner'
        shell: bash
        run: |
          d="$RUNNER_TEMP\\loam-tmp"; mkdir -p "$d"
          echo "TEMP=$d" >> "$GITHUB_ENV"; echo "TMP=$d" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: 20 loaded runs (code=${{ matrix.code }}, temp=${{ matrix.temp }})
        shell: bash
        run: |
          CODE=.; [ "${{ matrix.code }}" = main ] && CODE=code-main
          R="$GITHUB_WORKSPACE/results"; mkdir -p "$R"
          cd "$CODE" && npm ci --no-audit --no-fund >/dev/null
          node -p "'os.tmpdir() = ' + require('os').tmpdir()"
          for i in $(seq 1 20); do
            start=$(date +%s)
            npx vitest run $BUNDLE --reporter=dot --reporter=json --outputFile.json="$R/out-$i.json" > "$R/log-$i.txt" 2>&1 || true
            echo "iteration $i: $(( $(date +%s) - start ))s"
          done
          node "$GITHUB_WORKSPACE/.scratch/summarize.mjs" "$R"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "load-${{ matrix.code }}-${{ matrix.temp }}", path: results }

  isolated:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { temp: [default, runner] }
    steps:
      - uses: actions/checkout@v4
      - name: exempt the workspace and RUNNER_TEMP from Defender (as ci.yml does)
        shell: powershell
        run: foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) { Add-MpPreference -ExclusionPath $p }
      - name: put the tests' temp dir under RUNNER_TEMP
        if: matrix.temp == 'runner'
        shell: bash
        run: |
          d="$RUNNER_TEMP\\loam-tmp"; mkdir -p "$d"
          echo "TEMP=$d" >> "$GITHUB_ENV"; echo "TMP=$d" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: each target file 20 times, alone (fix, temp=${{ matrix.temp }})
        shell: bash
        run: |
          for f in test/federation/drop-cli.test.ts test/cli/user-roles.test.ts test/federation/install-by-federation-cli.test.ts; do
            pass=0
            for i in $(seq 1 20); do
              if npx vitest run "$f" --sequence.concurrent=false > log.txt 2>&1; then pass=$((pass+1)); else echo "FAIL $f #$i"; tail -40 log.txt; fi
            done
            echo "SUMMARY $f: $pass/20"
          done

# The green gate, enforced on both grounds Loam must grow in: linux and windows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: green-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Defender's real-time scan taxes every file CREATION in the kernel, where no concurrency
      # helps — the byte-heavy suites (archive: one file per delta; sqlite: WAL churn) pay it per
      # file. Excluding the workspace and the temp dir is the standard runner treatment; measured
      # need: archive.test.ts at 12-14s on windows vs 0.7s on linux, timing out under load (T155).
      # BEST EFFORT, and the try/catch is the point: this step buys SPEED, never correctness, so it
      # must not be able to fail the build. It did once — `Add-MpPreference` answered
      # `HRESULT 0x80041013` on a runner whose Defender service would not take the call, and a bare
      # `run:` turned an optimization into a red gate on a pull request that changed one JSON file.
      # A warning keeps the loss visible (the suite simply pays the scan tax) without pretending
      # nothing happened.
      - name: exempt the workspace from Defender's per-file scan (windows, best effort)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "excluded $p from Defender's real-time scan"
            } catch {
              Write-Warning "could not exclude $p from Defender ($($_.Exception.Message)); the suite pays the per-file scan tax on this runner"
            }
          }
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The trust-root gate suite (test/scripts/rails-guard-ci.test.ts) drives the REAL adlc CLI
      # against fixture repositories, and it FAILS CLOSED on CI when the CLI is missing — a runner
      # that lost its provisioning must not report the gate suite green having run none of it. So
      # the test job provisions what the suite refuses to fake.
      - run: npm i -g @adlc/cli
      - name: format + lint + typecheck + tests
        run: npm run check
        env:
          # fs.promises rides libuv's threadpool, default 4 threads — half the archive write
          # pool's width. Sixteen lets the pooled flushes (T155) actually overlap.
          UV_THREADPOOL_SIZE: "16"

  # The rail backstop. ADLC's in-session PreToolUse hook cannot gate Bash — a shell can't be reliably
  # parsed — so a rail edited through a shell command is caught here or nowhere. Linux only: the two
  # Windows patches this repo carries are for `adlc review` and `adlc init`, neither of which runs
  # in this job.
  rails:
    name: rails-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gate diffs against the base ref; a shallow clone has no base
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g @adlc/cli
      # The wrapper's rename exemption compares base+substitution to the branch AFTER the repo's
      # own prettier (a longer word rewraps lines) — so the gate needs the repo's exact prettier,
      # which lives in node_modules. Without it the raw compare still runs and a rewrapped rename
      # simply stays a violation; installing keeps the exemption whole.
      - run: npm ci
      - name: no frozen rail was edited
        run: |
          BASE="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          git fetch --quiet origin "${{ github.base_ref || github.event.repository.default_branch }}"
          node scripts/rails-guard-ci.mjs "$BASE"

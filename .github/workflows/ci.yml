name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: green-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: put the suite's temp dir on the runner's temp disk (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir="$RUNNER_TEMP\\loam-tmp"
          mkdir -p "$dir"
          echo "TEMP=$dir" >> "$GITHUB_ENV"
          echo "TMP=$dir" >> "$GITHUB_ENV"
      - name: exempt the workspace from Defender's per-file scan (windows, best effort)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($p in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "excluded $p from Defender's real-time scan"
            } catch {
              Write-Warning "could not exclude $p from Defender ($($_.Exception.Message)); the suite pays the per-file scan tax on this runner"
            }
          }
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: format + lint + typecheck + tests
        run: npm run check
        env:
          UV_THREADPOOL_SIZE: "16"
